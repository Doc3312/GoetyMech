plugins {
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = maven_group

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    // 切换到 Parchment 映射，改善 Mixin refmap 兼容性
    // 2023.09.03 是 1.20.1 的最新稳定 Parchment 版本
    mappings channel: 'parchment', version: '2023.09.03-1.20.1'

    runs {
        client {
            workingDirectory project.file('run')
            jvmArg '-Xmx2G'
            property 'forge.enabledGameTestNamespaces', mod_id

            // 与 Goety 自身开发环境一致，禁用 refmap 重映射
            // Goety 的 Mixin 注解在 fg.deobf() 后已是反混淆名称，无需 refmap
            property 'mixin.env.disableRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            // DEBUG 日志 — 测试 CrushingWheelEntity 碰撞检测用
            property 'forge.logging.console.level', 'debug'

            arg '-mixin.config=goetymech.mixins.json'

            mods {
                goetymech { source sourceSets.main }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.enabledGameTestNamespaces', mod_id

            // 服务端同样
            property 'mixin.env.disableRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            arg '-mixin.config=goetymech.mixins.json'

            mods {
                goetymech { source sourceSets.main }
            }
        }
    }
}

mixin {
    add sourceSets.main, "goetymech.refmap.json"
}

repositories {
    maven { url = 'https://maven.architectury.dev/' }
    maven { url = 'https://maven.shedaniel.me/' }
    maven { url = 'https://maven.theillusivec4.top/' }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
    mavenCentral()
    maven { url = "https://maven.createmod.net" }
    maven { url = "https://maven.ithundxr.dev/mirror" }
    maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" }
    maven {
        // JEI
        url = "https://maven.blamejared.com/"
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Curios - Goety 的强制前置依赖
    compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}+${minecraft_version}:api")
    runtimeOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}+${minecraft_version}")

    // Goety - 编译和运行时依赖
    implementation fg.deobf("curse.maven:goety-586095:8189894")

    // Create - 编译和运行时依赖
    implementation(fg.deobf("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false })
    implementation(fg.deobf("net.createmod.ponder:Ponder-Forge-${minecraft_version}:${ponder_version}"))
    compileOnly(fg.deobf("dev.engine-room.flywheel:flywheel-forge-api-${minecraft_version}:${flywheel_version}"))
    runtimeOnly(fg.deobf("dev.engine-room.flywheel:flywheel-forge-${minecraft_version}:${flywheel_version}"))
    implementation(fg.deobf("com.tterrag.registrate:Registrate:${registrate_version}"))

    // Mixin — 注解处理器
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // MixinExtras — Create 运行时必需（@WrapOperation）
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1"))
    implementation("io.github.llamalad7:mixinextras-forge:0.4.1")

    // JEI — 编译时需要完整 jar（IModPlugin 在 API 中不存在），运行时为可选
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")
    runtimeOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")

    // Patchouli — 编译时仅用 API，运行时使用完整 jar
    compileOnly fg.deobf("vazkii.patchouli:Patchouli:${patchouli_version}:api")
    runtimeOnly fg.deobf("vazkii.patchouli:Patchouli:${patchouli_version}")

    // Caelus — 可选依赖，提供 Curios 背部槽的飞行 attribute
    compileOnly fg.deobf("top.theillusivec4.caelus:caelus-forge:3.2.0+1.20.1:api")
    runtimeOnly fg.deobf("top.theillusivec4.caelus:caelus-forge:3.2.0+1.20.1")

    // JUnit 5 — 仅用于开发阶段的纯逻辑单元测试（src/test/java/）
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
}

test {
    useJUnitPlatform()
}

processResources {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: '[1.20.1,1.21)',
            forge_version          : forge_version,
            forge_version_range    : '[47,48)',
            loader_version_range   : '[47,)',
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.version,
                'Implementation-Vendor' : mod_authors,
                'MixinConfigs'          : 'goetymech.mixins.json'
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-Xlint:-removal')
}